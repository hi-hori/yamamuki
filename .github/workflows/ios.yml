name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**", "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

# 外部からの PR でも動くので、トークンはリポジトリの読み取りだけに絞る。
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen の準備
        run: brew install xcodegen
      - name: core の単体テストとシミュレーター向けビルド
        shell: bash
        run: |
          set -o pipefail
          bash ios/build-simulator.sh 2>&1 | tee ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios-build.log
          retention-days: 14
